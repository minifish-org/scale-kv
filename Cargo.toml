[package]
name = "scale_kv"
version = "0.1.0"
edition = "2024"
authors = ["scale-kv developers"]
build = "build.rs"

[dependencies]
anyhow = "1"
bytes = "1"
capnp = "0.18"
capnp-rpc = "0.18"
crc32fast = "1"
dashmap = "6"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
lru = "0.12"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "2"
sled = "0.34"
tempfile = "3"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "ycsb"
harness = false

[build-dependencies]
capnpc = "0.18"
