[package]
name = "scale_kv"
version = "0.1.0"
edition = "2024"
authors = ["scale-kv developers"]
build = "build.rs"
license = "AGPL-3.0-only"
description = "Experimental Rust key-value store with separate compute and storage"
repository = "https://github.com/minifish-org/scale-kv"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
capnp = "0.24"
capnp-rpc = "0.27"
crc32fast = "1"
dashmap = "6"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
lru = "0.18.2"
parking_lot = "0.12"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[build-dependencies]
capnpc = "0.24"
